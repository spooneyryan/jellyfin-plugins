# Build and test on every push and pull request; on a pushed release tag (<plugin>/v<x.y.z>, such as bookmarks/v1.2.2),
# also package that plugin and publish its zip as the tag's GitHub release. The release procedure is in scripts/README.md.
# Run by hand (workflow_dispatch), it only packages the chosen plugin as a tag would and checks it against manifest.json,
# without the tests and without releasing; the zip and its per-file SHA-256s are kept as the run's artifact.
# Every plugin has two lines: Jellyfin 10.11 (build.yaml, net9.0, 1.x) and Jellyfin 12 (build.12.yaml, net10.0, 2.x,
# built with -p:JellyfinTarget=12). The tests run for both; a tag's line is the build file that says its version.
name: CI

on:
  push:
    branches: [main]
    tags: ['*/v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to package and check against manifest.json (nothing is released)
        required: true
        type: choice
        options: [AccessRoles, Bookmarks, LibraryMaintenance, SmartSearch, TagCloud, UserRatings]
      jellyfin_target:
        description: Jellyfin line to package (10.11 is build.yaml, 12 is build.12.yaml)
        required: true
        default: '10.11'
        type: choice
        options: ['10.11', '12']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The SDK releases are built with: Package-Release.ps1 warns when a local build uses another one, as its DLLs can
  # differ, and the release job refuses a zip whose MD5 isn't the one manifest.json has.
  RELEASE_SDK: '10.0.302'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - jellyfin_target: '10.11'
            jellyfin_tag: v10.11.5
            framework: net9.0
          - jellyfin_target: '12'
            jellyfin_tag: v12.4
            framework: net10.0
    name: test (Jellyfin ${{ matrix.jellyfin_target }})
    env:
      JELLYFIN_TARGET: ${{ matrix.jellyfin_target }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the release-tag tests read the tags

      - uses: actions/setup-dotnet@v5
        with:
          # 9.0 builds Jellyfin.Api 10.11.5 below (its global.json asks for a 9.0 SDK); RELEASE_SDK builds the plugins
          # and Jellyfin.Api 12.4 (its global.json asks for 10.0.0 or a later 10.0 SDK).
          dotnet-version: |
            9.0.x
            ${{ env.RELEASE_SDK }}

      - name: Pin the plugins' build to RELEASE_SDK
        shell: pwsh
        # A global.json next to the checkout, not in it, so the working tree stays clean.
        run: |
          $file = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'global.json'
          Set-Content -LiteralPath $file -Value "{ `"sdk`": { `"version`": `"$env:RELEASE_SDK`", `"rollForward`": `"disable`" } }"
          dotnet --version

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build Jellyfin.Api ${{ matrix.jellyfin_tag }} for the Access Roles action-manifest test
        shell: pwsh
        env:
          JELLYFIN_TAG: ${{ matrix.jellyfin_tag }}
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'jellyfin'
          git clone --quiet --depth 1 --branch $env:JELLYFIN_TAG https://github.com/jellyfin/jellyfin.git $source
          if ($LASTEXITCODE -ne 0) { throw 'git clone failed' }
          # From the clone's folder, so its own global.json picks its SDK.
          Push-Location $source
          dotnet build Jellyfin.Api/Jellyfin.Api.csproj -c Release --nologo -v quiet -p:TreatWarningsAsErrors=false
          $built = $LASTEXITCODE
          Pop-Location
          if ($built -ne 0) { throw 'The Jellyfin.Api build failed' }
          $dll = Join-Path $source "Jellyfin.Api/bin/Release/$env:FRAMEWORK/Jellyfin.Api.dll"
          if (-not (Test-Path -LiteralPath $dll)) { throw "No $dll" }
          "JELLYFIN_API_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: dotnet build jellyfin-plugins.slnx -c Release --nologo -p:JellyfinTarget=${{ matrix.jellyfin_target }}

      # Windows PowerShell, the shell the scripts target: the tests start powershell.exe, and one started from pwsh
      # inherits pwsh's PSModulePath (the tests and JellyfinSandbox.psm1 also drop 7's module folders themselves).
      # -m:2: at most two test assemblies at once (each still runs its own tests in parallel). With all of them at once on
      # the runner's 4 cores, tests that wait on real time timed out (2026-11-11); the tests' waits are generous too.
      - name: Test
        shell: powershell
        run: dotnet test jellyfin-plugins.slnx -c Release --no-build --nologo -m:2 "-p:JellyfinTarget=$env:JELLYFIN_TARGET"

      # Line-independent: once, with the 10.11 job.
      - name: Node tests (kit and scripts)
        if: matrix.jellyfin_target == '10.11'
        shell: powershell
        run: |
          $files = @(Get-ChildItem kit/web/tests, scripts/tests -Filter '*.test.mjs' -File | ForEach-Object { $_.FullName })
          node --test --test-timeout=120000 @files
          if ($LASTEXITCODE -ne 0) { throw 'node tests failed' }

  release:
    # A tag, after the tests; or by hand, without them (test is skipped then) and without the publishing steps.
    if: ${{ !failure() && !cancelled() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch') }}
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.RELEASE_SDK }}

      - name: Pin the build to RELEASE_SDK
        shell: pwsh
        run: |
          $file = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'global.json'
          Set-Content -LiteralPath $file -Value "{ `"sdk`": { `"version`": `"$env:RELEASE_SDK`", `"rollForward`": `"disable`" } }"
          dotnet --version

      - name: Package the tag's plugin and check it against manifest.json
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: ./scripts/Package-Release.ps1 -Tag "$env:GITHUB_REF_NAME" -Verify

      - name: Package the chosen plugin and check it against manifest.json (no release)
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          PLUGIN: ${{ inputs.plugin }}
          JELLYFIN_TARGET: ${{ inputs.jellyfin_target }}
        run: ./scripts/Package-Release.ps1 -Plugin "$env:PLUGIN" -JellyfinTarget "$env:JELLYFIN_TARGET" -Verify

      # When the zip isn't manifest.json's (or on a run by hand): keep it and the SHA-256 of each file in it, to compare
      # with a local build's artifacts\release\<zip>.sha256.
      - name: Keep the built zip and its per-file SHA-256s
        if: ${{ always() && (failure() || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v5
        with:
          name: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
            artifacts/release/*.md5
            artifacts/release/release.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = @(Get-Content artifacts/release/release.json -Raw | ConvertFrom-Json)[0]
          $zip = "artifacts/release/$($release.zip)"
          # A rerun (after a failed check below) replaces the asset of the release the first run made.
          gh release view "$env:GITHUB_REF_NAME" --json name 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" $zip --clobber
            if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
          }
          else {
            gh release create "$env:GITHUB_REF_NAME" $zip --verify-tag --title "$($release.name) $($release.version -replace '\.0$', '')" --notes-file "$zip.notes.md"
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }

      - name: Download the catalog's sourceUrl as Jellyfin does, and check its MD5
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.json's md5 and sourceUrl are manifest.json's: the packaging step's -Verify required both.
          $release = @(Get-Content artifacts/release/release.json -Raw | ConvertFrom-Json)[0]
          $file = Join-Path $env:RUNNER_TEMP $release.zip
          $md5 = $null
          for ($try = 1; $try -le 5; $try++) {
            try {
              $response = Invoke-WebRequest -Uri $release.sourceUrl -OutFile $file -PassThru -MaximumRedirection 10
              if ($response.StatusCode -ne 200) { throw "HTTP $($response.StatusCode)" }
              $md5 = (Get-FileHash -LiteralPath $file -Algorithm MD5).Hash.ToLowerInvariant()
              break
            }
            catch {
              Write-Host "Try ${try}: $($release.sourceUrl): $($_.Exception.Message)"
              Start-Sleep -Seconds (10 * $try)
            }
          }
          if (-not $md5) { throw "Jellyfin could not download $($release.sourceUrl)." }
          if ($md5 -ne $release.md5) { throw "$($release.sourceUrl) has MD5 $md5, but manifest.json says $($release.md5)." }
          "Downloaded $($release.sourceUrl): HTTP 200, MD5 $md5, as manifest.json says."
          # GitHub's own spelling of the URL may differ (%2F or /) and still serve the same file: only a warning.
          $assets = gh release view "$env:GITHUB_REF_NAME" --json assets | ConvertFrom-Json
          $url = @($assets.assets | Where-Object { $_.name -eq $release.zip })[0].url
          if ($url -ne $release.sourceUrl) { "::warning::The asset's browser_download_url is $url; manifest.json's sourceUrl $($release.sourceUrl) serves the same file." }
