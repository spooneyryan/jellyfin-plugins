overview: "Give your users roles that lock their settings and pick which libraries they can open"
description: >
  Access Roles is for anyone who shares a Jellyfin server with family, kids
  or guests. You make roles, starting from a Kid, Guest or Standard preset,
  that lock parts of a user's own settings, keep them away from the
  Dashboard and from other users, and pick which libraries they can open.
  The server enforces the roles in every app, not just the web client, and
  keeps library access up to date as libraries come and go. You see a
  preview of every change before it is saved, with an audit log, snapshots
  and export to fall back on. You can also turn the library access your
  users already have into roles in one step.
category: "General"
owner: "NoRepine"
