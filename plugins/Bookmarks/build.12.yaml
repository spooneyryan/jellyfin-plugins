version: "2.5.2.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Bookmark moments in movies and episodes, name them, and turn them into clips"
description: >
  Bookmarks And Clips lets everyone on your server save moments in movies and
  episodes, give them a name and jump back to them later. Press Shift+B
  while you watch, then find your bookmarks on the progress bar, on the
  video's own page or on the My Bookmarks page. Give a bookmark an end time
  and it can be cut into a clip, which you can preview, download and manage
  on My Clips, or keep in a clip library with the movie's artwork. You can
  also export a whole playlist into one video file, and bring over the
  bookmarks you made in Jellyfin Enhanced.
category: "General"
owner: "NoRepine"
