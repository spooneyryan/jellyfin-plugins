overview: "Find the movies you have more than once, and preview moving media"
description: >
  Library Maintenance helps you find the movies you have more than once.
  It adds a Dashboard page for administrators that lists the duplicates
  across your libraries, explains why each match was made, shows the
  space the extra copies take and suggests a copy to keep. You can filter
  and sort the groups, and compare a movie's copies side by side to
  decide which to keep. You can also preview moving a movie, episode or
  music video to another folder, and export and import your settings.
  Nothing in your libraries is deleted, moved or changed.
category: "General"
