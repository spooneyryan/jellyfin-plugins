overview: "An Advanced Search page with rules over title, year, library and more, saved queries, and auto-collections"
description: >
  Adds an Advanced Search page under Library tools in the menu: find movies,
  shows and episodes by title, year, library, type, genre and many more
  fields, combine rules with All and Any groups, and save searches, private
  or shared. Every search runs as the signed-in user, over the libraries they
  can open. Administrators and users who manage collections can turn a
  saved search into an auto-collection, a Jellyfin collection the plugin
  keeps equal to the search's results. Administrators set the limits a
  search runs under and export, import and restore the saved searches and
  auto-collections.
