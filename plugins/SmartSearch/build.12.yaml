framework: "net10.0"
overview: "Search by almost any detail, save and share searches, and build collections that update themselves"
description: >
  Smart Search And Dynamic Collections adds an Advanced Search page for
  finding movies, shows, episodes and more by title, year, genre, people,
  ratings, watch state and many other details. You can mix rules in groups,
  then save a search for yourself or share it with everyone on your server.
  Each search only finds what the person running it can see. Admins and
  collection managers can turn a saved search into a dynamic collection
  that updates itself as your library changes, keeps your own adds and
  removes, and holds back large removals for review when a drive goes
  missing.
category: "General"
