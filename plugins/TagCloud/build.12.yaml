overview: "Shows your library's tags, genres, people and studios as a word cloud you can click through"
description: >
  Tag Cloud turns your library's tags, genres, actors, directors, writers
  and studios into a word cloud, with the most common words drawn biggest.
  Click any word to see the movies and shows behind it, hold it down to see
  them as a cloud of their own, or right-click a few words to narrow the
  cloud down. You can change how the cloud looks, show it full screen, and
  save the ones you like to rename, copy or share with everyone on your
  server. Each person's cloud counts just the titles they can see.
