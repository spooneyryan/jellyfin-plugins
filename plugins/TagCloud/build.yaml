framework: "net9.0"
overview: "A Tag Cloud page: your library's tags, genres, people and studios as a word cloud"
description: >
  Adds a Tag Cloud page under Library tools in the menu: the tags, genres,
  actors, directors, writers or studios of your movies and shows, each word
  sized by how many titles carry it. Pick libraries and how many words, click
  a word to list its titles, hold it for a cloud of them, right-click it to
  narrow the cloud, change the look in Settings, save clouds (private or
  shared) and show any of them full screen. Counts only ever cover what the
  viewer may see; no other plugin is needed for the web UI.
category: "General"
owner: "NoRepine"
artifacts:
- "Jellyfin.Plugin.TagCloud.dll"
changelog: |
  1.2.0
  - A word's titles can be filtered by name (or original title,
    ignoring case and accents), sorted by name, release date, date
    added or rating either way round, limited to a minimum resolution
    (movies) or to what you haven't watched, with Reset and a count of
    how many are left. The choices are kept per user on each device.
  - Resting the mouse on an actor, director or writer shows their
    photo and how many titles credit them; in a word's held-down
    cloud, resting on a title shows its poster.
  1.1.0
  - A word's titles now show as poster cards, like a library or a
    collection, each opening the title's page.
  - With Mix sizes turned up, long words no longer stick out to the
    side of the cloud: a word that comes late goes where it keeps to
    the cloud's shape.
  1.0.1
  - First public release.
  - A Tag Cloud page that shows the tags, genres, actors, directors, writers or studios of your movies and shows as a word cloud; click a word to see its titles.
  - Saved clouds, private or shared, and a full-screen view. Counts only cover what the viewer may see.

  1.0.0
  - First release. The Tag Cloud page under Library tools: the tags,
    genres, actors, directors, writers or studios of your movies, shows or
    both, over any of your libraries, 25 to 1,000 words. Click a word for
    its titles, hold it for a cloud of them, right-click it to narrow the
    cloud.
  - The settings panel: layout, shape, size mixing, spacing, letter case,
    font, sizes, scale, palettes, colour rule and backdrops, kept per
    device.
  - Saved clouds, private or shared, and a read-only full-screen view of
    any of them.
  - Counts only ever cover what the viewer may see.
  - Not in this release: export and import of the saved clouds.
