overview: "A Tag Cloud page: your library's tags, genres, people and studios as a word cloud"
description: >
  Adds a Tag Cloud page under Library tools in the menu: the tags, genres,
  actors, directors, writers or studios of your movies and shows, each word
  sized by how many titles carry it. Pick libraries and how many words, click
  a word to list its titles, hold it for a cloud of them, right-click it to
  narrow the cloud, change the look in Settings, save clouds (private or
  shared) and show any of them full screen. Counts only ever cover what the
  viewer may see; no other plugin is needed for the web UI.
category: "General"
