  1.0.0
  - First release. The Tag Cloud page under Library tools: the tags,
    genres, actors, directors, writers or studios of your movies, shows or
    both, over any of your libraries, 25 to 1,000 words. Click a word for
    its titles, hold it for a cloud of them, right-click it to narrow the
    cloud.
  - The settings panel: layout, shape, size mixing, spacing, letter case,
    font, sizes, scale, palettes, colour rule and backdrops, kept per
    device.
  - Saved clouds, private or shared, and a read-only full-screen view of
    any of them.
  - Counts only ever cover what the viewer may see.
  - Not in this release: export and import of the saved clouds.
