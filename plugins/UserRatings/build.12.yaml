targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Lets everyone on your server rate and review what they watch, from half a star to five stars"
description: >
  User Ratings And Reviews lets the people on your server rate movies, shows,
  episodes, albums, books and more from half a star to five stars, and
  write a review if they like. Everyone sees each other's ratings and
  reviews on the titles they can open, with the members' average, a
  histogram and spoilers kept blurred. As an admin you choose who may rate
  and what can be rated, and remove reviews that don't belong, with a log
  of each removal. You can back up, restore and move every rating with
  export, import and daily snapshots, and ratings stay with their titles
  when files move. If you used Jellyfin Enhanced's reviews, you can bring
  them over, or send them back.
category: "General"
owner: "NoRepine"
