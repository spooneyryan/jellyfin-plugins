overview: "Five-star ratings with half stars and reviews, shared by every member of the server"
description: >
  Lets members rate any movie, show, season, episode, album, book or video
  from half a star to five stars and write a review, on the item's details
  page; everyone on the server sees every member's ratings and reviews on the
  items they can open, with the member average. Admins can limit who may
  rate, moderate reviews and import Jellyfin Enhanced's reviews. Ratings
  follow their items through library scans and moves and are kept while a
  drive is away; the settings page has every setting, the moderation, and
  the Data tab: export, import, snapshots and restore, the detached
  ratings, and the export back to Jellyfin Enhanced.
category: "General"
